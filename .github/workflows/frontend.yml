name: Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      # Mobile Lighthouse audit (scripts/lighthouse.mjs): accessibility, best practices and SEO must be 90+.
      # Performance needs 80+ here: shared CI runners are slower and noisier than a real phone or a
      # quiet workstation, where the target is 90+ (see docs/architecture.md, "Performance").
      - name: Lighthouse
        env:
          LH_MIN_PERFORMANCE: "0.8"
        run: |
          npm start -- --port 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100 && break; sleep 2; done
          npm run lighthouse

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
